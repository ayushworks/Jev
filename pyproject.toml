[project]
name = "judge-compare"
version = "0.1.0"
description = "Reproducible comparison of Jev and a frontier model as customer-support response judges"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jev experiment contributors" }]
dependencies = [
    "httpx>=0.28,<0.29",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "pandas>=2.2,<4",
]
jev = ["typesafe-sdk==0.7.0"]
openai = ["openai==3.16.2"]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[project.scripts]
judge-compare = "judge_compare.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judge_compare"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]
