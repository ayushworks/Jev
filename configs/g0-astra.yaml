  commit: adfea74905f721ea2594e22804c8c8edf1693163
  experiment_id: 6d08df72-c878-458c-b7c5-a7824ee6e721
  audit_mode: archived_no_model_calls

benchmark:
  repository: https://github.com/sierra-research/tau2-bench
  commit: 17e07b1da2bbc0cadfddeea36412686e0604127b
  version: 0.2.1-dev
  domain: retail
  source_submission: claude-sonnet-4-5_sierra_2026-02-26
  source_trajectory_file: claude-sonnet-4-5_enabled_retail_gpt-5.2_4trials.json
  source_agent_model: anthropic/claude-sonnet-4-5-20250929
